name: Weekly BWCC Google Drive RSS Update

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-bwcc-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run BWCC Drive Monitor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -u bwcc_drive_monitor.py

      - name: Commit and Push Updated Feed & Archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          [ -f bwcc_archive.json ] && git add bwcc_archive.json
          [ -f bwcc_feed.xml ] && git add bwcc_feed.xml
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update BWCC RSS feed and archive [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
