name: Keep GitHub Actions Alive

on:
  schedule:
    # Runs on the 1st and 15th of every month to stay well within the 60-day window
    - cron: '0 0 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Keepalive
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          commit_message: "chore: keepalive scheduled workflows [skip ci]"
          committer_username: "github-actions[bot]"
          committer_email: "github-actions[bot]@users.noreply.github.com"
