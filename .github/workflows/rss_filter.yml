name: AI RSS Filter

on:
  schedule:
    # Runs every 15 minutes. 
    # Using an off-peak offset (e.g. 3, 18, 33, 48) rather than 0, 15, 30, 45 
    # significantly reduces delays caused by high runner contention across GitHub.
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:      # Allows manual execution and external API triggers
  repository_dispatch:    # Allows triggering from external webhooks
    types: [rss_filter_trigger]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  filter-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # Speeds up execution by caching installed wheels

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Filter Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u filter_feeds.py

      - name: Commit Database Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update archive and proxy databases"
          file_pattern: "*.json"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
