name: AI RSS Filter

on:
  schedule:
    # Runs every 30 minutes
    - cron: '3,33 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [rss_filter_trigger]

permissions:
  contents: write
  pages: write
  id-token: write

# If a new trigger arrives while Python is still processing, cancel the older run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  filter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Filter Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -u filter_feeds.py

      - name: Commit Database Updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update archive and proxy databases [skip ci]"
          file_pattern: "*.json"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

  deploy:
    needs: filter
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
